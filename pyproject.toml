[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "local-transcriber"
version = "0.0.1"
description = "Local desktop transcription of long OBS recordings into Russian text."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.4",
]

[project.scripts]
local-transcriber = "local_transcriber.__main__:main"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "uv>=0.12,<0.13",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcriber"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: requires local external tools or PostgreSQL",
    "gpu: requires a compatible local GPU runtime and model",
]
# Future tests import the installed package; do not inject src into sys.path.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = [
    "data",
    "media",
    "recordings",
    "models",
    "checkpoints",
    "transcripts",
    "exports",
    "logs",
    "tmp",
    "temp",
    "work",
    "backups",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
